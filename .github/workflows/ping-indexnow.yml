name: Ping IndexNow after Vercel Deploy

# Triggers when Vercel reports a deployment status back to GitHub.
# This fires AFTER the site is actually live — no polling or fixed delays needed.
on:
  deployment_status:

jobs:
  ping-indexnow:
    # Only run when Vercel's Production deployment succeeds
    if: |
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'roduction')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0          # full history: the diff base can be several commits back (see below)

      - name: Detect changed page URLs
        id: urls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Diff base = the commit of the last successful ping run, so pages changed in commits whose own
          # Vercel deployment was superseded (several pushes in a row) are still submitted.
          # Falls back to the parent commit when there is no earlier run or it is not an ancestor.
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ping-indexnow.yml --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base=HEAD~1
          fi
          echo "Diff base: $base"
          # Map every changed .html file to its public URL
          changed=$(git diff --name-only "$base" HEAD -- '*.html' 2>/dev/null || true)
          urls=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Site uses cleanUrls + trailingSlash:false — strip .html, and
            # collapse a trailing /index (or bare index) to the directory root
            # so IndexNow gets the canonical URL, not a 308-redirect source.
            u="${f%.html}"
            if [ "$u" = "index" ]; then
              u=""
            else
              u="${u%/index}"
            fi
            urls="$urls https://sourciavera.com/$u"
          done <<< "$changed"

          # Always include homepage when sitemap or index changes
          if git diff --name-only "$base" HEAD | grep -qE '(sitemap\.xml|index\.html)'; then
            urls="$urls https://sourciavera.com/"
          fi

          # Fallback: at minimum ping the homepage
          if [ -z "$(echo "$urls" | tr -d ' ')" ]; then
            urls="https://sourciavera.com/"
          fi

          # Deduplicate
          urls=$(echo "$urls" | tr ' ' '\n' | sort -u | grep 'http' | tr '\n' ' ')
          echo "list=$urls" >> "$GITHUB_OUTPUT"
          echo "URLs to ping: $urls"

      - name: Ping Bing IndexNow
        env:
          CHANGED_URLS: ${{ steps.urls.outputs.list }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, sys

          KEY  = "e6cc767a2c98457b875afd5423178cc0"
          HOST = "sourciavera.com"
          urls = [u for u in os.environ["CHANGED_URLS"].split() if u]

          print(f"Submitting {len(urls)} URL(s) to IndexNow...")

          payload = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls,
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"[{r.status}] Accepted — IndexNow queued {len(urls)} URL(s)")
          except urllib.error.HTTPError as e:
              codes = {
                  400: "Bad Request — malformed URL list",
                  403: "Forbidden — key file unreachable",
                  422: "Unprocessable — URLs don't match host",
                  429: "Too Many Requests",
              }
              print(f"[{e.code}] {codes.get(e.code, e.reason)}", file=sys.stderr)
              sys.exit(1)

          for u in urls:
              print(f"  ✓ {u}")
          PYEOF
